<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563A6"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212B; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; }
      .math { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-style: italic; }
      .panel { fill: #FFFFFF; stroke: #AAB6C2; stroke-width: 1.5; }
      .node { fill: #F7F9FB; stroke: #64748B; stroke-width: 1.5; }
      .blue { fill: #EAF2FA; stroke: #3973A8; stroke-width: 1.6; }
      .green { fill: #EAF4EF; stroke: #4B8066; stroke-width: 1.6; }
      .gold { fill: #FBF3E5; stroke: #AD8034; stroke-width: 1.6; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .learn { fill: none; stroke: #2563A6; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrowBlue); }
      .divider { stroke: #D7DEE5; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="48" text-anchor="middle" class="title">Long-Term Externality-Aware Multi-Agent SAC</text>

  <!-- Stage 1: five-step online flow -->
  <rect x="40" y="88" width="300" height="555" rx="8" class="panel"/>
  <text x="64" y="124" class="section">1. Online interaction</text>
  <rect x="80" y="160" width="220" height="58" rx="6" class="node"/>
  <text x="190" y="183" text-anchor="middle" class="small">Observe state and report types</text>
  <text x="190" y="203" text-anchor="middle" class="math">s(t), type reports</text>
  <path d="M190 218 V238" class="flow"/>
  <rect x="80" y="238" width="220" height="58" rx="6" class="gold"/>
  <text x="190" y="261" text-anchor="middle" class="small">Sample training branch κ</text>
  <text x="190" y="281" text-anchor="middle" class="small">κ=0 (1−ε), κ=n (ε/N)</text>
  <path d="M190 296 V316" class="flow"/>
  <rect x="80" y="316" width="220" height="58" rx="6" class="blue"/>
  <text x="190" y="339" text-anchor="middle" class="small">Select UAV action</text>
  <text x="190" y="359" text-anchor="middle" class="small">Task admission and location</text>
  <path d="M190 374 V394" class="flow"/>
  <rect x="80" y="394" width="220" height="58" rx="6" class="node"/>
  <text x="190" y="417" text-anchor="middle" class="small">Execute MEC service</text>
  <text x="190" y="437" text-anchor="middle" class="small">Offloading and UAV flight</text>
  <path d="M190 452 V472" class="flow"/>
  <rect x="80" y="472" width="220" height="58" rx="6" class="gold"/>
  <text x="190" y="495" text-anchor="middle" class="small">Payment and state update</text>
  <text x="190" y="515" text-anchor="middle" class="small">Charge users, update state</text>

  <!-- Stage 2: two mutually exclusive rollout branches -->
  <rect x="375" y="88" width="650" height="555" rx="8" class="panel"/>
  <text x="399" y="124" class="section">2. Branch-specific training rollouts</text>
  <rect x="405" y="158" width="590" height="200" rx="7" fill="#F6FAFD" stroke="#B7C9D9" stroke-width="1.3"/>
  <text x="429" y="190" class="label">Full-system branch (κ = 0)</text>
  <rect x="425" y="218" width="155" height="86" rx="6" class="blue"/>
  <text x="502" y="250" text-anchor="middle" class="label">UAV policy</text>
  <image href="algorithm_math/full_policy_math.svg" x="437" y="266" width="131" height="25"/>
  <path d="M580 261 H615" class="flow"/>
  <rect x="622" y="218" width="160" height="86" rx="6" class="node"/>
  <text x="702" y="250" text-anchor="middle" class="label">MEC environment</text>
  <text x="702" y="277" text-anchor="middle" class="small">execute joint action</text>
  <path d="M782 261 H817" class="flow"/>
  <rect x="824" y="218" width="148" height="86" rx="6" class="green"/>
  <text x="898" y="249" text-anchor="middle" class="label">Welfare</text>
  <text x="898" y="276" text-anchor="middle" class="small">and transitions</text>
  <text x="700" y="335" text-anchor="middle" class="small">Store full transitions for the UAV and users</text>

  <rect x="405" y="386" width="590" height="220" rx="7" fill="#FCFAF6" stroke="#DDCFB5" stroke-width="1.3"/>
  <text x="429" y="418" class="label">User-removal counterfactual (κ = n)</text>
  <rect x="425" y="447" width="155" height="86" rx="6" class="gold"/>
  <text x="502" y="479" text-anchor="middle" class="label">Mask user n</text>
  <image href="algorithm_math/mask_math.svg" x="458" y="493" width="90" height="26"/>
  <path d="M580 490 H615" class="flow"/>
  <rect x="622" y="447" width="160" height="86" rx="6" class="blue"/>
  <text x="702" y="479" text-anchor="middle" class="label">Counterfactual</text>
  <image href="algorithm_math/counterfactual_action_math.svg" x="638" y="493" width="127" height="26"/>
  <path d="M782 490 H817" class="flow"/>
  <rect x="824" y="447" width="148" height="86" rx="6" class="green"/>
  <text x="898" y="478" text-anchor="middle" class="label">Reduced system</text>
  <text x="898" y="505" text-anchor="middle" class="small">welfare transition</text>
  <text x="700" y="576" text-anchor="middle" class="small">Store counterfactual UAV transition in the shared UAV buffer</text>

  <!-- Branch selection arrows -->
  <path d="M300 250 H350 V261 H420" class="flow"/>
  <path d="M300 276 H366 V490 H420" class="flow"/>

  <!-- Stage 3: externality payment -->
  <rect x="1060" y="88" width="500" height="290" rx="8" class="panel"/>
  <text x="1084" y="124" class="section">3. Long-term externality payment</text>
  <rect x="1090" y="158" width="440" height="78" rx="6" class="gold"/>
  <text x="1310" y="180" text-anchor="middle" class="label">Counterfactual critic</text>
  <image href="algorithm_math/critic_math.svg" x="1214" y="187" width="190" height="25"/>
  <text x="1310" y="228" text-anchor="middle" class="small">Evaluate the removal environment</text>
  <path d="M1310 236 V258" class="flow"/>
  <rect x="1090" y="265" width="440" height="82" rx="6" class="green"/>
  <text x="1310" y="288" text-anchor="middle" class="label">Compare long-term values</text>
  <image href="algorithm_math/payment_math.svg" x="1130" y="305" width="360" height="30"/>
  <path d="M972 490 H1040 V197 H1084" class="learn"/>
  <path d="M502 218 V145 H1040 V306 H1084" class="learn"/>

  <!-- Stage 4: shared learning loop -->
  <rect x="1060" y="410" width="500" height="233" rx="8" class="panel"/>
  <text x="1084" y="446" class="section">4. Shared multi-agent SAC learning</text>
  <rect x="1090" y="476" width="125" height="82" rx="6" class="node"/>
  <text x="1152" y="508" text-anchor="middle" class="label">Replay</text>
  <text x="1152" y="533" text-anchor="middle" class="small">buffers</text>
  <path d="M1215 517 H1240" class="flow"/>
  <rect x="1247" y="476" width="250" height="82" rx="6" class="blue"/>
  <text x="1372" y="507" text-anchor="middle" class="label">Update actors and critics</text>
  <text x="1372" y="534" text-anchor="middle" class="small">user and UAV policies</text>
  <path d="M1497 517 H1520 V597 H1152 V565" class="learn"/>
  <text x="1340" y="622" text-anchor="middle" class="small" fill="#2563A6">policy / value feedback to the next rollout</text>

  <line x1="45" y1="690" x2="1555" y2="690" class="divider"/>
  <line x1="70" y1="730" x2="130" y2="730" class="flow"/>
  <text x="144" y="736" class="small">Environment interaction / data flow</text>
  <line x1="430" y1="730" x2="490" y2="730" class="learn"/>
  <text x="504" y="736" class="small">Learning signal / value transfer</text>
</svg>
